name: anthys
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned toolchain
        run: npm install --prefix /tmp/oa-toolchain node@24.21.0 pnpm@10.34.7
      - name: Use pinned runtime
        run: |
          echo /tmp/oa-toolchain/node_modules/node/bin >> "$GITHUB_PATH"
          echo /tmp/oa-toolchain/node_modules/.bin >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:prepare
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
      - name: Install controlled browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify self DM flow with controlled providers
        run: pnpm test:self-dm
      - run: pnpm verify:requirements
      - run: pnpm audit --audit-level high
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actual-verification-results
          path: reports/
