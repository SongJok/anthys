# 钉钉智能体管理控制台反向代理
# 放置位置：/etc/nginx/conf.d/anthys.conf
# 证书准备：/etc/nginx/cert/fullchain.pem + /etc/nginx/cert/privkey.pem
#
# 安全要点：
#   1) 安全组与本文件双重限制来源 IP，控制台不要直接暴露 8787
#   2) ADMIN_API_TOKEN 必须设置为强随机值（未设置时管理 API 不校验任何令牌）

upstream anthys_admin {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    server_name anthys.example.com;
    # 证书签发后把 80 端口改成 301 跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name anthys.example.com;

    ssl_certificate     /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 25m;      # 附件入站上限 ATTACHMENT_MAX_MB=20，留余量

    access_log /var/log/nginx/anthys.access.log;
    error_log  /var/log/nginx/anthys.error.log;

    location / {
        # 仅允许指定来源访问控制台；按需增删 IP / 网段
        allow 203.0.113.0/24;        # 公司出口
        # allow 10.0.0.0/8;          # VPN 网段
        deny all;

        proxy_pass http://anthys_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：在线对话 /api/v1/chat/stream 是长连接，必须关缓冲并放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;     # 不短于 LOOP_MAX_WALL_TIME_MS
        proxy_send_timeout 900s;
    }

    # 健康检查不暴露给公网，供本机探针与负载均衡使用
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://anthys_admin;
    }
}
